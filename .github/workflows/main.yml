name: Build Stepwgn NR-MZ25 13-Band DSQ APK
on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Clean v4.0 Full-Screen Project & Compile Stepwgn APK
        run: |
          mkdir -p /tmp/stepwgn_apk/app/src/main/java/com/jagastech/stepwgndsq

          cat << 'EOF' > /tmp/stepwgn_apk/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StepwgnDSQ"
          include(":app")
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jagastech.stepwgndsq"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jagastech.stepwgndsq"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-FullScreen-SForce-4Seat"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="NR-MZ25 DSQ v4.0"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <action android:name="android.media.action.DISPLAY_AUDIO_EFFECT_CONTROL_PANEL" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DsqAudioEngineService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"
                      android:stopWithTask="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/app/src/main/java/com/jagastech/stepwgndsq/BootReceiver.kt
          package com.jagastech.stepwgndsq

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val serviceIntent = Intent(context, DsqAudioEngineService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent)
                  } else {
                      context.startService(serviceIntent)
                  }
              }
          }
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/app/src/main/java/com/jagastech/stepwgndsq/DsqAudioEngineService.kt
          package com.jagastech.stepwgndsq

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.media.audiofx.AudioEffect
          import android.media.audiofx.DynamicsProcessing
          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import android.os.Binder
          import android.os.Build
          import android.os.IBinder
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class DsqAudioEngineService : Service() {
              inner class LocalBinder : Binder() {
                  fun getService(): DsqAudioEngineService = this@DsqAudioEngineService
              }

              private val binder = LocalBinder()
              private lateinit var prefs: SharedPreferences
              private val activeDynamicsProcessors = mutableMapOf<Int, DynamicsProcessing>()
              private val activeLegacyEqualizers = mutableMapOf<Int, Equalizer>()
              private val activeLoudnessEnhancers = mutableMapOf<Int, LoudnessEnhancer>()

              val centerFrequenciesHz = intArrayOf(50, 80, 125, 200, 315, 500, 800, 1250, 2000, 3150, 5000, 8000, 16000)
              private val bandCutoffFrequenciesHz = floatArrayOf(63f, 100f, 160f, 250f, 400f, 630f, 1000f, 1600f, 2500f, 4000f, 6300f, 11300f, 20000f)
              private val loudnessWeights = floatArrayOf(0.10f, 0.45f, 0.40f, 0.00f, -0.15f, 0.10f, 0.15f, 0.35f, 0.50f, 0.55f, 0.60f, 0.65f, 0.70f)
              private val sForceLeftWeights  = floatArrayOf(0.00f, 0.10f, 0.15f, -0.20f, -0.35f, 0.45f, -0.35f, 0.55f, -0.45f, 0.80f, -0.40f, 0.85f, 0.90f)
              private val sForceRightWeights = floatArrayOf(0.00f, 0.10f, 0.15f, -0.20f, -0.35f, -0.35f, 0.45f, -0.40f, 0.60f, 0.65f, 0.75f, 0.50f, 0.90f)

              var currentGainsDb = floatArrayOf(0f, 3f, 2f, 0f, -2f, -1f, 0f, 1f, 2f, 2f, 3f, 3f, 3f)
              var subwTrimDb: Float = 0f
              var loudnessGainDb: Float = 3f
              var spatialStrengthPct: Int = 65
              var seatingMode: Int = 0
              var isDspActive: Boolean = true

              private val sessionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val sessionId = intent?.getIntExtra(AudioEffect.EXTRA_AUDIO_SESSION, 0) ?: 0
                      when (intent?.action) {
                          AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION -> attachToSession(sessionId)
                          AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION -> releaseSession(sessionId)
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("stepwgn_nrmz25_v4_prefs", Context.MODE_PRIVATE)
                  loadSavedSettings()
                  startForegroundNotification()
                  attachToSession(0)

                  val filter = IntentFilter().apply {
                      addAction(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION)
                      addAction(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(sessionReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(sessionReceiver, filter)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  applyGainsToEngine()
                  return START_STICKY
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val restartIntent = Intent(applicationContext, DsqAudioEngineService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      applicationContext.startForegroundService(restartIntent)
                  } else {
                      applicationContext.startService(restartIntent)
                  }
                  super.onTaskRemoved(rootIntent)
              }

              private fun saveSettings() {
                  val editor = prefs.edit()
                  for (i in 0 until 13) editor.putFloat("band_$i", currentGainsDb[i])
                  editor.putFloat("subw_trim", subwTrimDb)
                  editor.putFloat("loudness_db", loudnessGainDb)
                  editor.putInt("spatial_pct", spatialStrengthPct)
                  editor.putInt("seating_mode", seatingMode)
                  editor.putBoolean("dsp_active", isDspActive)
                  editor.apply()
              }

              private fun loadSavedSettings() {
                  if (!prefs.contains("band_0")) return
                  for (i in 0 until 13) currentGainsDb[i] = prefs.getFloat("band_$i", currentGainsDb[i])
                  subwTrimDb = prefs.getFloat("subw_trim", 0f)
                  loudnessGainDb = prefs.getFloat("loudness_db", 3f)
                  spatialStrengthPct = prefs.getInt("spatial_pct", 65)
                  seatingMode = prefs.getInt("seating_mode", 0)
                  isDspActive = prefs.getBoolean("dsp_active", true)
              }

              private fun attachToSession(sessionId: Int) {
                  try {
                      if (!activeLoudnessEnhancers.containsKey(sessionId)) {
                          activeLoudnessEnhancers[sessionId] = LoudnessEnhancer(sessionId).apply {
                              enabled = isDspActive && loudnessGainDb > 0f
                          }
                      }
                  } catch (_: Exception) {}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try {
                          if (!activeDynamicsProcessors.containsKey(sessionId)) {
                              val config = DynamicsProcessing.Config.Builder(
                                  DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION,
                                  2, true, 13, true, 6, true, 13, true
                              ).build()
                              activeDynamicsProcessors[sessionId] = DynamicsProcessing(100, sessionId, config).apply {
                                  enabled = isDspActive
                              }
                          }
                          applyGainsToEngine()
                          return
                      } catch (_: Exception) {}
                  }

                  try {
                      if (!activeLegacyEqualizers.containsKey(sessionId)) {
                          activeLegacyEqualizers[sessionId] = Equalizer(100, sessionId).apply {
                              enabled = isDspActive
                          }
                      }
                      applyGainsToEngine()
                  } catch (_: Exception) {}
              }

              private fun releaseSession(sessionId: Int) {
                  if (sessionId == 0) return
                  activeDynamicsProcessors.remove(sessionId)?.release()
                  activeLegacyEqualizers.remove(sessionId)?.release()
                  activeLoudnessEnhancers.remove(sessionId)?.release()
              }

              fun getChannelBandGainDb(i: Int, isRight: Boolean): Float {
                  if (!isDspActive) return 0f
                  var g = currentGainsDb[i]
                  if (i == 0) g += subwTrimDb * 0.5f
                  if (i == 1) g += subwTrimDb * 1.0f
                  if (i == 2) g += subwTrimDb * 0.75f
                  g += loudnessGainDb * loudnessWeights[i]
                  val sFactor = (spatialStrengthPct / 100f) * 3.8f
                  g += if (isRight) (sForceRightWeights[i] * sFactor) else (sForceLeftWeights[i] * sFactor)
                  if (i in 7..11) {
                      when (seatingMode) {
                          1 -> if (!isRight) g += 1.8f
                          2 -> if (isRight) g += 1.8f
                          3 -> g += 2.5f
                      }
                  }
                  return g.coerceIn(-12f, 12f)
              }

              fun applyGainsToEngine() {
                  saveSettings()
                  val targetLoudnessMb = if (isDspActive) (loudnessGainDb * 95f).roundToInt() else 0
                  for ((_, le) in activeLoudnessEnhancers) {
                      try {
                          le.setTargetGain(targetLoudnessMb)
                          le.enabled = isDspActive && loudnessGainDb > 0f
                      } catch (_: Exception) {}
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P && activeDynamicsProcessors.isNotEmpty()) {
                      val leftEq = DynamicsProcessing.Eq(true, true, 13)
                      val rightEq = DynamicsProcessing.Eq(true, true, 13)
                      for (i in 0 until 13) {
                          leftEq.setBand(i, DynamicsProcessing.EqBand(true, bandCutoffFrequenciesHz[i], getChannelBandGainDb(i, false)))
                          rightEq.setBand(i, DynamicsProcessing.EqBand(true, bandCutoffFrequenciesHz[i], getChannelBandGainDb(i, true)))
                      }
                      val leftInputDb = when (seatingMode) {
                          1 -> 2.2f
                          2 -> -1.5f
                          else -> 0f
                      }
                      val rightInputDb = when (seatingMode) {
                          1 -> -1.5f
                          2 -> 2.2f
                          else -> 0f
                      }
                      val limiter = DynamicsProcessing.Limiter(true, true, 0, 1.5f, 35f, 4.0f, -0.6f, 0f)
                      for ((_, dp) in activeDynamicsProcessors) {
                          dp.setInputGainbyChannel(0, leftInputDb)
                          dp.setInputGainbyChannel(1, rightInputDb)
                          dp.setPreEqByChannelIndex(0, leftEq)
                          dp.setPreEqByChannelIndex(1, rightEq)
                          dp.setLimiterAllChannelsTo(limiter)
                          dp.enabled = isDspActive
                      }
                  }

                  for ((_, eq) in activeLegacyEqualizers) {
                      val numBands = eq.numberOfBands.toInt()
                      val range = eq.bandLevelRange
                      for (b in 0 until numBands) {
                          val centerHz = eq.getCenterFreq(b.toShort()) / 1000
                          val nearestIdx = centerFrequenciesHz.indices.minByOrNull { abs(centerFrequenciesHz[it] - centerHz) } ?: 0
                          val avgDb = (getChannelBandGainDb(nearestIdx, false) + getChannelBandGainDb(nearestIdx, true)) * 0.5f
                          val targetMillibel = (avgDb * 100f).roundToInt().coerceIn(range[0].toInt(), range[1].toInt())
                          eq.setBandLevel(b.toShort(), targetMillibel.toShort())
                      }
                      eq.enabled = isDspActive
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "stepwgn_dsq_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Stepwgn NR-MZ25 v4.0 DSQ", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                      val openUiIntent = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      val notification = Notification.Builder(this, channelId)
                          .setContentTitle("Stepwgn DSQ v4.0 + S-Force 3D Active")
                          .setContentText("Anti-Rattle 50Hz Guard • 4-Seat Stage (<8MB RAM)")
                          .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                          .setContentIntent(openUiIntent)
                          .setOngoing(true)
                          .build()
                      startForeground(1001, notification)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(sessionReceiver) } catch (_: Exception) {}
                  activeDynamicsProcessors.values.forEach { it.release() }
                  activeLegacyEqualizers.values.forEach { it.release() }
                  activeLoudnessEnhancers.values.forEach { it.release() }
              }

              override fun onBind(intent: Intent?): IBinder = binder
          }
          EOF

          cat << 'EOF' > /tmp/stepwgn_apk/app/src/main/java/com/jagastech/stepwgndsq/MainActivity.kt
          package com.jagastech.stepwgndsq

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.ServiceConnection
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.roundToInt

          class MainActivity : Activity() {
              private var dsqService: DsqAudioEngineService? = null
              private var selectedBandIndex = 1
              private lateinit var activeBandTitle: TextView
              private lateinit var subwStatusTv: TextView
              private lateinit var loudnessStatusTv: TextView
              private lateinit var spatialStatusTv: TextView
              private lateinit var seatingStatusTv: TextView
              private lateinit var eqGraphicView: EqGraphicCanvasView
              private val bandLabels = arrayOf("50", "80", "125", "200", "315", "500", "800", "1.25k", "2k", "3.15k", "5k", "8k", "16k")

              private val connection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, service: IBinder?) {
                      val binder = service as DsqAudioEngineService.LocalBinder
                      dsqService = binder.getService()
                      refreshHeadUnitUI()
                  }
                  override fun onServiceDisconnected(name: ComponentName?) {
                      dsqService = null
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  enableImmersiveFullscreen()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0E14"))
                      setPadding(16, 10, 16, 10)
                  }

                  fun makeBtn(label: String, bgHex: String = "#1E293B", weight: Float = 0f, onClick: () -> Unit): Button {
                      return Button(this).apply {
                          text = label
                          textSize = 11f
                          typeface = Typeface.MONOSPACE
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor(bgHex))
                          setPadding(10, 4, 10, 4)
                          val lp = if (weight > 0f) {
                              LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, weight)
                          } else {
                              LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          }
                          lp.setMargins(4, 2, 4, 2)
                          layoutParams = lp
                          setOnClickListener { onClick() }
                      }
                  }

                  val row1 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#131822"))
                      setPadding(12, 6, 12, 6)
                  }
                  activeBandTitle = TextView(this).apply {
                      text = "B2 (80Hz): +3dB"
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#F59E0B"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  row1.addView(activeBandTitle)
                  row1.addView(makeBtn("◀ BAND") { selectedBandIndex = (selectedBandIndex + 12) % 13; refreshHeadUnitUI() })
                  row1.addView(makeBtn("-1 dB", "#B45309") { stepSelectedBand(-1f) })
                  row1.addView(makeBtn("0 dB") { setSelectedBand(0f) })
                  row1.addView(makeBtn("+1 dB", "#047857") { stepSelectedBand(1f) })
                  row1.addView(makeBtn("BAND ▶") { selectedBandIndex = (selectedBandIndex + 1) % 13; refreshHeadUnitUI() })

                  subwStatusTv = TextView(this).apply {
                      text = "  SUBW: 0dB "
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#38BDF8"))
                  }
                  row1.addView(subwStatusTv)
                  row1.addView(makeBtn("SUB -", "#0369A1") {
                      dsqService?.let { it.subwTrimDb = (it.subwTrimDb - 1f).coerceIn(-6f, 4f); it.applyGainsToEngine(); refreshHeadUnitUI() }
                  })
                  row1.addView(makeBtn("SUB +", "#0369A1") {
                      dsqService?.let { it.subwTrimDb = (it.subwTrimDb + 1f).coerceIn(-6f, 4f); it.applyGainsToEngine(); refreshHeadUnitUI() }
                  })

                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#161F2E"))
                      setPadding(12, 6, 12, 6)
                  }
                  loudnessStatusTv = TextView(this).apply {
                      text = "LOUD:+3dB "
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#10B981"))
                  }
                  row2.addView(loudnessStatusTv)
                  listOf(0f to "OFF", 3f to "+3dB", 6f to "+6dB", 9f to "+9dB").forEach { (db, lbl) ->
                      row2.addView(makeBtn(lbl, "#065F46") {
                          dsqService?.let { it.loudnessGainDb = db; it.applyGainsToEngine(); refreshHeadUnitUI() }
                      })
                  }

                  spatialStatusTv = TextView(this).apply {
                      text = " 3D:65% "
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#A78BFA"))
                  }
                  row2.addView(spatialStatusTv)
                  listOf(0 to "OFF", 40 to "APPLE", 65 to "S-FORCE", 95 to "ATMOS").forEach { (pct, lbl) ->
                      row2.addView(makeBtn(lbl, "#4C1D95") {
                          dsqService?.let { it.spatialStrengthPct = pct; it.applyGainsToEngine(); refreshHeadUnitUI() }
                      })
                  }

                  seatingStatusTv = TextView(this).apply {
                      text = " SEAT:ALL "
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#38BDF8"))
                  }
                  row2.addView(seatingStatusTv)
                  listOf(0 to "ALL", 1 to "DRV-R", 2 to "PASS-L", 3 to "REAR").forEach { (mode, lbl) ->
                      row2.addView(makeBtn(lbl, "#0284C7") {
                          dsqService?.let { it.seatingMode = mode; it.applyGainsToEngine(); refreshHeadUnitUI() }
                      })
                  }

                  val row3 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 4, 0, 4)
                  }
                  val presets = linkedMapOf(
                      "SpaceBuds 4 (Safe)" to floatArrayOf(0f, 3f, 2f, 0f, -2f, -1f, 0f, 1f, 2f, 2f, 3f, 3f, 3f),
                      "SpaceBuds 2" to floatArrayOf(0f, 2f, 2f, 0f, -1f, -1f, 0f, 1f, 2f, 2f, 2f, 3f, 2f),
                      "Stepwgn De-Box" to floatArrayOf(-1f, 3f, 2f, -1f, -3f, -1f, 0f, 1f, 2f, 2f, 2f, 3f, 3f),
                      "Amapiano Safe" to floatArrayOf(1f, 4f, 3f, -1f, -2f, -1f, 0f, 1f, 2f, 2f, 3f, 4f, 3f),
                      "Flat 0dB" to FloatArray(13) { 0f }
                  )
                  for ((name, curve) in presets) {
                      row3.addView(makeBtn(name, "#1E293B", 1f) {
                          dsqService?.let { it.currentGainsDb = curve.clone(); it.applyGainsToEngine(); refreshHeadUnitUI() }
                      })
                  }

                  eqGraphicView = EqGraphicCanvasView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }

                  root.addView(row1)
                  root.addView(row2)
                  root.addView(row3)
                  root.addView(eqGraphicView)
                  setContentView(root)

                  Intent(this, DsqAudioEngineService::class.java).also { intent ->
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                      bindService(intent, connection, Context.BIND_AUTO_CREATE)
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) enableImmersiveFullscreen()
              }

              private fun enableImmersiveFullscreen() {
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  )
              }

              private fun stepSelectedBand(delta: Float) {
                  val current = dsqService?.currentGainsDb?.get(selectedBandIndex) ?: 0f
                  setSelectedBand((current + delta).coerceIn(-12f, 12f))
              }

              private fun setSelectedBand(newDb: Float) {
                  dsqService?.let {
                      it.currentGainsDb[selectedBandIndex] = newDb
                      it.applyGainsToEngine()
                      refreshHeadUnitUI()
                  }
              }

              private fun refreshHeadUnitUI() {
                  val svc = dsqService ?: return
                  val freq = svc.centerFrequenciesHz[selectedBandIndex]
                  val gain = svc.currentGainsDb[selectedBandIndex].roundToInt()
                  activeBandTitle.text = "B${selectedBandIndex + 1} (${freq}Hz): ${if (gain >= 0) "+" else ""}${gain}dB"
                  val subw = svc.subwTrimDb.roundToInt()
                  subwStatusTv.text = "  SUBW:${if (subw >= 0) "+" else ""}${subw}dB "
                  loudnessStatusTv.text = "LOUD:+${svc.loudnessGainDb.roundToInt()}dB "
                  spatialStatusTv.text = " 3D:${svc.spatialStrengthPct}% "
                  val seatNames = arrayOf("ALL", "DRV-R", "PASS-L", "REAR")
                  seatingStatusTv.text = " SEAT:${seatNames[svc.seatingMode.coerceIn(0, 3)]} "
                  eqGraphicView.invalidate()
              }

              inner class EqGraphicCanvasView(context: Context) : View(context) {
                  private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#0F141D") }
                  private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#263248")
                      strokeWidth = 2f
                      style = Paint.Style.STROKE
                      pathEffect = DashPathEffect(floatArrayOf(8f, 8f), 0f)
                  }
                  private val zeroLinePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#475569")
                      strokeWidth = 3f
                      style = Paint.Style.STROKE
                  }
                  private val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#1E293B")
                      strokeWidth = 14f
                      strokeCap = Paint.Cap.ROUND
                  }
                  private val activeColPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#22F59E0B")
                      style = Paint.Style.FILL
                  }
                  private val baseCurvePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#38BDF8")
                      strokeWidth = 6f
                      style = Paint.Style.STROKE
                  }
                  private val leftSForcePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#10B981")
                      strokeWidth = 3.5f
                      style = Paint.Style.STROKE
                      pathEffect = DashPathEffect(floatArrayOf(10f, 6f), 0f)
                  }
                  private val rightSForcePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#A855F7")
                      strokeWidth = 3.5f
                      style = Paint.Style.STROKE
                      pathEffect = DashPathEffect(floatArrayOf(6f, 10f), 0f)
                  }
                  private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val thumbPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 20f
                      textAlign = Paint.Align.CENTER
                      typeface = Typeface.MONOSPACE
                  }
                  private val curvePath = Path()
                  private val leftPath = Path()
                  private val rightPath = Path()
                  private val fillPath = Path()
                  private val colRect = RectF()

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val svc = dsqService ?: return
                      val w = width.toFloat()
                      val h = height.toFloat()
                      if (w <= 0f || h <= 0f) return

                      canvas.drawRect(0f, 0f, w, h, bgPaint)

                      val topPad = 42f
                      val botPad = 44f
                      val usableH = h - topPad - botPad
                      val midY = topPad + usableH * 0.5f
                      val colW = w / 13f

                      canvas.drawLine(0f, topPad, w, topPad, gridPaint)
                      canvas.drawLine(0f, topPad + usableH * 0.25f, w, topPad + usableH * 0.25f, gridPaint)
                      canvas.drawLine(0f, midY, w, midY, zeroLinePaint)
                      canvas.drawLine(0f, topPad + usableH * 0.75f, w, topPad + usableH * 0.75f, gridPaint)
                      canvas.drawLine(0f, topPad + usableH, w, topPad + usableH, gridPaint)

                      val xs = FloatArray(13)
                      val baseYs = FloatArray(13)
                      val leftYs = FloatArray(13)
                      val rightYs = FloatArray(13)

                      for (i in 0 until 13) {
                          val cx = colW * i + colW * 0.5f
                          xs[i] = cx
                          val baseDb = svc.currentGainsDb[i].coerceIn(-12f, 12f)
                          val leftDb = svc.getChannelBandGainDb(i, false)
                          val rightDb = svc.getChannelBandGainDb(i, true)

                          baseYs[i] = midY - (baseDb / 12f) * (usableH * 0.5f)
                          leftYs[i] = midY - (leftDb / 12f) * (usableH * 0.5f)
                          rightYs[i] = midY - (rightDb / 12f) * (usableH * 0.5f)

                          if (i == selectedBandIndex) {
                              colRect.set(colW * i + 4f, 4f, colW * (i + 1) - 4f, h - 4f)
                              canvas.drawRoundRect(colRect, 14f, 14f, activeColPaint)
                          }

                          canvas.drawLine(cx, topPad, cx, topPad + usableH, trackPaint)

                          val gInt = baseDb.roundToInt()
                          textPaint.color = if (gInt > 0) Color.parseColor("#F59E0B") else if (gInt < 0) Color.parseColor("#38BDF8") else Color.parseColor("#94A3B8")
                          textPaint.textSize = 19f
                          canvas.drawText("${if (gInt >= 0) "+" else ""}${gInt}dB", cx, 28f, textPaint)

                          textPaint.color = if (i == selectedBandIndex) Color.parseColor("#F59E0B") else Color.WHITE
                          textPaint.textSize = 19f
                          canvas.drawText(bandLabels[i], cx, h - 12f, textPaint)
                      }

                      fun buildSpline(ptsX: FloatArray, ptsY: FloatArray, outPath: Path) {
                          outPath.reset()
                          outPath.moveTo(ptsX[0], ptsY[0])
                          for (i in 0 until 12) {
                              val p0x = ptsX[if (i == 0) 0 else i - 1]
                              val p0y = ptsY[if (i == 0) 0 else i - 1]
                              val p1x = ptsX[i]; val p1y = ptsY[i]
                              val p2x = ptsX[i + 1]; val p2y = ptsY[i + 1]
                              val p3x = ptsX[if (i + 2 < 13) i + 2 else 12]
                              val p3y = ptsY[if (i + 2 < 13) i + 2 else 12]
                              val cp1x = p1x + (p2x - p0x) / 6f
                              val cp1y = p1y + (p2y - p0y) / 6f
                              val cp2x = p2x - (p3x - p1x) / 6f
                              val cp2y = p2y - (p3y - p1y) / 6f
                              outPath.cubicTo(cp1x, cp1y, cp2x, cp2y, p2x, p2y)
                          }
                      }

                      buildSpline(xs, baseYs, curvePath)
                      buildSpline(xs, leftYs, leftPath)
                      buildSpline(xs, rightYs, rightPath)

                      fillPath.set(curvePath)
                      fillPath.lineTo(xs[12], midY)
                      fillPath.lineTo(xs[0], midY)
                      fillPath.close()
                      fillPaint.shader = LinearGradient(0f, topPad, 0f, topPad + usableH, Color.parseColor("#4438BDF8"), Color.parseColor("#0538BDF8"), Shader.TileMode.CLAMP)
                      canvas.drawPath(fillPath, fillPaint)

                      canvas.drawPath(leftPath, leftSForcePaint)
                      canvas.drawPath(rightPath, rightSForcePaint)
                      canvas.drawPath(curvePath, baseCurvePaint)

                      for (i in 0 until 13) {
                          val isSel = i == selectedBandIndex
                          thumbPaint.color = if (isSel) Color.parseColor("#F59E0B") else Color.parseColor("#38BDF8")
                          canvas.drawCircle(xs[i], baseYs[i], if (isSel) 15f else 11f, thumbPaint)
                          thumbPaint.color = Color.parseColor("#0B0E14")
                          canvas.drawCircle(xs[i], baseYs[i], if (isSel) 6f else 4f, thumbPaint)
                      }
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      if (event.action == MotionEvent.ACTION_DOWN || event.action == MotionEvent.ACTION_MOVE) {
                          val w = width.toFloat()
                          val h = height.toFloat()
                          if (w > 0f && h > 0f) {
                              val colIdx = ((event.x / w) * 13f).toInt().coerceIn(0, 12)
                              selectedBandIndex = colIdx
                              val topPad = 42f
                              val botPad = 44f
                              val usableH = h - topPad - botPad
                              val normY = ((event.y - topPad) / usableH).coerceIn(0f, 1f)
                              val newDb = ((0.5f - normY) * 24f).roundToInt().toFloat().coerceIn(-12f, 12f)
                              setSelectedBand(newDb)
                          }
                          return true
                      }
                      return super.onTouchEvent(event)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unbindService(connection)
              }
          }
          EOF

          cd /tmp/stepwgn_apk
          gradle assembleDebug --no-daemon
          cp /tmp/stepwgn_apk/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/Stepwgn_NRMZ25_13Band_DSQ.apk

      - name: Upload Compiled Stepwgn APK
        uses: actions/upload-artifact@v4
        with:
          name: Stepwgn-NRMZ25-13Band-DSQ-APK
          path: Stepwgn_NRMZ25_13Band_DSQ.apk
