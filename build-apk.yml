name: Build Stepwgn NR-MZ25 13-Band DSQ APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Debug APK (Auto-detect folder structure)
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ./Stepwgn_NRMZ25_13Band_DSQ.apk
          elif [ -f "Stepwgn_NRMZ25_Android_Studio/settings.gradle.kts" ]; then
            cd Stepwgn_NRMZ25_Android_Studio
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Stepwgn_NRMZ25_13Band_DSQ.apk
          fi

      - name: Upload Compiled Stepwgn APK
        uses: actions/upload-artifact@v4
        with:
          name: Stepwgn-NRMZ25-13Band-DSQ-APK
          path: Stepwgn_NRMZ25_13Band_DSQ.apk
